name: Run Tests

on:
  push:
    branches:
      - '*'   # or '*' to run on all branches
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Linux headers
        run: sudo apt-get update && sudo apt-get install -y linux-headers-generic libi2c-dev libgpiod-dev

      - name: Prepare
        run: chmod +x ./test.sh

      - name: Run tests
        run: ./test.sh

